<section class="deo-status-page">
  <div class="deo-status-shell card border-0 shadow-sm overflow-hidden">
    <div class="deo-status-header card-header border-0 px-3 py-3">
      <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3">
        <div>
          <h5 class="deo-status-title mb-1">Application Status</h5>
        </div>

        <div class="deo-status-summary d-flex align-items-center gap-2 flex-wrap">
          <button type="button"
            class="summary-chip summary-chip-pending rounded-3"
            [class.active]="selectedFilter.toLowerCase() === 'pending'"
            (click)="setStatusFilter('Pending')"
            title="Filter by Pending">
            {{ getPendingCount() }} Pending
          </button>
          <button type="button"
            class="summary-chip summary-chip-approved rounded-3"
            [class.active]="selectedFilter.toLowerCase() === 'approved/verified'"
            (click)="setStatusFilter('Approved/Verified')"
            title="Filter by Verified">
            {{ getApprovedOrVerifiedCount() }} Verified
          </button>
          <button type="button"
            class="summary-chip summary-chip-objection rounded-3"
            [class.active]="selectedFilter.toLowerCase() === 'objection'"
            (click)="setStatusFilter('Objection')"
            title="Filter by Objection">
            {{ getObjectionCount() }} Objection
          </button>
          <button type="button"
            class="summary-chip summary-chip-total rounded-3"
            [class.active]="selectedFilter === ''"
            (click)="setStatusFilter('')"
            title="Show All Records">
            {{ getTotalCount() }} Records
          </button>
        </div>
      </div>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0 table-deo-status">
          <thead class="table-head-portal">
            <tr>
              <th scope="col" class="text-center" style="width: 150px;">Allottee Code</th>
              <th scope="col">Allottee Name</th>
              <th scope="col">Status</th>
              <th scope="col">Remarks</th>
              <th scope="col" class="text-center">Actions</th>
            </tr>
          </thead>
          <tbody>

            <!-- Loading State -->
            <tr *ngIf="isLoading">
              <td colspan="5" class="text-center py-4">
                <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                <span class="text-muted">Loading records...</span>
              </td>
            </tr>

            <!-- Error State -->
            <tr *ngIf="!isLoading && errorMessage">
              <td colspan="5" class="text-center py-4 text-danger">
                <i class="fa-solid fa-circle-exclamation me-2"></i>{{ errorMessage }}
              </td>
            </tr>

            <!-- Data Rows -->
            <tr *ngFor="let item of pagedPropertyList">
              <td>
                <span class="fw-bold text-dark">{{ item.allotteeCode }}</span>
              </td>

              <td class="fw-semibold text-secondary">{{ item.allotteeName }}</td>

              <td>
                <span class="badge badge-status" [ngClass]="getStatusClass(item.approvalStatus)">
                  {{ item.approvalStatus || '—' }}
                </span>
              </td>

              <td class="text-wrap text-muted small deo-remarks">
                {{ item.remarks || '—' }}
              </td>

              <td class="text-center">
                <div class="action-stack">

                  <button type="button" class="btn btn-action-icon" (click)="onView(item)" title="View Form Details">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                  <button type="button" class="btn btn-action-icon btn-action-edit"
                    [disabled]="item.approvalStatus !== 'Objection'" (click)="onEdit(item)"
                    [attr.title]="item.approvalStatus === 'Objection' ? 'Edit Form Details' : 'Edit disabled for this status'">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                </div>
              </td>
            </tr>

            <!-- No Records -->
            <tr *ngIf="!isLoading && !errorMessage && pagedPropertyList.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">
                <i class="fa-solid fa-inbox me-2 fs-5"></i>No matching records found.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
<div class="mt-3 border-0 rounded-3 bg-white shadow-sm" *ngIf="filteredList.length > 0">
  <mat-paginator [length]="filteredList.length" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 50, 100]"
    [pageIndex]="pageIndex" (page)="onPageChange($event)">
  </mat-paginator>
</div>
